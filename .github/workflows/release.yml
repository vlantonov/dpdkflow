name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config python3-pyelftools
          sudo apt-get install -y dpdk libdpdk-dev

      - name: Configure
        run: meson setup build

      - name: Build
        run: ninja -C build

      - name: Run unit tests (gate before release)
        run: ./build/tests/test_flow_key && ./build/tests/test_ip_format

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/dpdkflow
          token: ${{ secrets.GITHUB_TOKEN }}
